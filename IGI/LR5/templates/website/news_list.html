{% extends "base.html" %}
{% block content %}
<h1>Наши новости</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 20px;">
    {% for article in news %}
        <div style="border: 1px solid #ddd; border-radius: 10px; overflow: hidden; background: #fff;">
            {% if article.image %}
                <img src="{{ article.image.url }}" style="width: 100%; height: 200px; object-fit: cover;">
            {% endif %}
            <div style="padding: 15px;">
                <h3 style="margin: 0 0 10px 0;">{{ article.title }}</h3>
                <p style="color: #666; font-size: 0.9em;">{{ article.content|truncatewords:25 }}</p>
                <small style="color: #999;">{{ article.created_at|date:"d M Y" }}</small>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
