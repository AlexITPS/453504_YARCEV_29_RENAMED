{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border: 1px solid #eee;">
    <h2 style="margin-top: 0; color: #333;">Подтверждение заказа</h2>
    <hr>
    
    <div style="margin: 20px 0;">
        <p style="font-size: 1.1em; margin-bottom: 5px;">Услуга: <strong>{{ service.name }}</strong></p>
        <p style="font-size: 1.2em; color: #2c3e50;">Цена: <strong>{{ service.price }} руб.</strong></p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; color: #666;">Есть промокод?</label>
            <input type="text" name="promo_code" placeholder="Введите код..." 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" style="flex: 2; background: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Оформить заказ
            </button>
            <a href="{% url 'service_list' %}" style="flex: 1; text-align: center; background: #6c757d; color: white; text-decoration: none; padding: 12px; border-radius: 5px;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
